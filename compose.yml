name: ai-application-automation

x-environment: &environment
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  ADMIN_SECRET_FILE: /run/secrets/admin
  INTERNAL_SECRET_FILE: /run/secrets/internal
  LLM_BASE_URL: ${LLM_BASE_URL:-http://inference:8000/v1}
  LLM_API_KEY_FILE: /run/secrets/internal
  LLM_MODEL_ID: ${LLM_MODEL_ID:-Qwen3.5-9B}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
  LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-32768}
  LLM_OUTPUT_TOKENS: ${LLM_OUTPUT_TOKENS:-2048}
  APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
  DB_BUSY_TIMEOUT_MS: 5000
  DIAGNOSTIC_RETENTION_DAYS: ${DIAGNOSTIC_RETENTION_DAYS:-7}
  RUN_LOG_RETENTION_DAYS: ${RUN_LOG_RETENTION_DAYS:-30}
  RESOURCE_MAX_BYTES: 20971520
  NEXT_TELEMETRY_DISABLED: 1

services:
  gateway:
    image: nginx:1.28.0-alpine
    ports:
      - '127.0.0.1:3000:8080'
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [edge, frontend]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health/live]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    init: true
    user: '1000:1000'
    environment: *environment
    secrets: [admin, internal]
    volumes:
      - data:/data
      - ./resources:/resources
      - ./output:/output:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt: [no-new-privileges:true]
    networks: [frontend, backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: infra/worker.Dockerfile
    init: true
    user: '1000:1000'
    shm_size: 1gb
    environment:
      <<: *environment
      DISPLAY: ':99'
    secrets: [admin, internal]
    volumes:
      - data:/data
      - browser-profiles:/browser-profiles
      - ./resources:/resources:ro
      - ./output:/output
      - diagnostics:/diagnostics
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
      - seccomp=./infra/seccomp_profile.json
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      web:
        condition: service_healthy
    networks: [backend, inference, egress]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  inference:
    build:
      context: ./services/inference
    environment:
      MODEL_ID: Qwen3.5-9B
      MODEL_SEARCH_ROOT: /models
      MAX_MODEL_LEN: '32768'
      MODEL_IDLE_SECONDS: ${MODEL_IDLE_SECONDS:-300}
      MODEL_LOAD_TIMEOUT_SECONDS: ${MODEL_LOAD_TIMEOUT_SECONDS:-180}
      MODEL_UNLOAD_TIMEOUT_SECONDS: ${MODEL_UNLOAD_TIMEOUT_SECONDS:-30}
      INFERENCE_AUTH_SECRET_FILE: /run/secrets/internal
      PORT: 8000
    init: true
    user: '10001:10001'
    secrets: [internal]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    deploy:
      resources:
        limits:
          memory: ${INFERENCE_MEMORY_LIMIT:-24g}
        reservations:
          memory: ${INFERENCE_MEMORY_RESERVATION:-16g}
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    expose: ['8000']
    volumes:
      - model-cache:/home/inference/.cache/huggingface
      - type: bind
        source: ${MODEL_SEARCH_ROOT:-D:/AI-Models}
        target: /models
        read_only: true
    restart: unless-stopped
    networks: [inference]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 5

networks:
  edge: {}
  frontend:
    internal: true
  backend:
    internal: true
  inference:
    internal: true
  egress: {}

volumes:
  data:
  browser-profiles:
  diagnostics:
  model-cache:

secrets:
  admin:
    file: ./.secrets/admin.txt
  internal:
    file: ./.secrets/internal.txt
