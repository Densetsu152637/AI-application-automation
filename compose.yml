name: ai-application-automation

x-environment: &environment
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  ADMIN_SECRET_FILE: /run/secrets/admin
  INTERNAL_SECRET_FILE: /run/secrets/internal
  LM_BASE_URL: ${LM_BASE_URL:-http://host.docker.internal:1234/v1}
  LM_MODEL_ID: ${LM_MODEL_ID:-}
  LM_TIMEOUT_SECONDS: ${LM_TIMEOUT_SECONDS:-120}
  LM_CONTEXT_TOKENS: ${LM_CONTEXT_TOKENS:-8192}
  LM_OUTPUT_TOKENS: ${LM_OUTPUT_TOKENS:-2048}
  APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
  DB_BUSY_TIMEOUT_MS: 5000
  DIAGNOSTIC_RETENTION_DAYS: ${DIAGNOSTIC_RETENTION_DAYS:-7}
  RUN_LOG_RETENTION_DAYS: ${RUN_LOG_RETENTION_DAYS:-30}
  RESOURCE_MAX_BYTES: 20971520
  NEXT_TELEMETRY_DISABLED: 1

services:
  gateway:
    image: nginx:1.28.0-alpine
    ports:
      - '127.0.0.1:3000:8080'
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    networks: [edge, frontend]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health/live]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    init: true
    user: '1000:1000'
    environment: *environment
    secrets: [admin, internal]
    volumes:
      - data:/data
      - ./output:/output:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt: [no-new-privileges:true]
    networks: [frontend, backend]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: infra/worker.Dockerfile
    init: true
    user: '1000:1000'
    shm_size: 1gb
    environment:
      <<: *environment
      DISPLAY: ':99'
    secrets: [admin, internal]
    volumes:
      - data:/data
      - browser-profiles:/browser-profiles
      - ./resources:/resources:ro
      - ./output:/output
      - diagnostics:/diagnostics
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
      - seccomp=./infra/seccomp_profile.json
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      web:
        condition: service_healthy
    networks: [backend, egress]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

networks:
  edge: {}
  frontend:
    internal: true
  backend:
    internal: true
  egress: {}

volumes:
  data:
  browser-profiles:
  diagnostics:

secrets:
  admin:
    file: ./.secrets/admin.txt
  internal:
    file: ./.secrets/internal.txt
